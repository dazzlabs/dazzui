menu:
  # Base UI's menu search session; GTK supplies navigation and activation,
  # and the port adds the same incremental label search.
  typeahead-reset-duration:
    $type: duration
    $value: 500ms
  # A menu narrower than its trigger reads as broken, whatever its labels.
  min-width:
    $type: dimension
    $value: 11rem
  # 7px — the block padding that lands a 12px/1 label on a 26px row, the
  # menu-row height the design draws. Off the 4px grid the way the segmented
  # inset is, and for the same reason: the row is sized to its optics.
  item-padding:
    $type: dimension
    $value: 0.4375rem
