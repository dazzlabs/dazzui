toast:
  message-line-height:
    $type: number
    $value: 1.4
  # Shared with the native queue and the generated React runtime constants.
  notice-duration:
    $type: duration
    $value: 5000ms
  action-duration:
    $type: duration
    $value: 8000ms
  transition:
    duration:
      $type: duration
      $value: 260ms
    x1:
      $type: number
      $value: 0.21
    y1:
      $type: number
      $value: 0.9
    x2:
      $type: number
      $value: 0.35
    y2:
      $type: number
      $value: 1.05
    offset:
      $type: dimension
      $value: "{spacing.2.5}"
    scale:
      $type: number
      $value: 0.98
  # The cap a one-line receipt truncates at rather than spanning the window.
  max-width:
    $type: dimension
    $value: 26.25rem
