# The colour vocabulary, whole: the ramps a tint binds, the roles a theme
# re-points, and the interactive recipes. Themes are not files — they are the
# modes carried inline on whichever token varies, because Terrazzo merges
# token files by replacing a whole token: a second file re-declaring
# `color.surface` to add a mode replaces the first outright, and a file
# carrying only `$extensions` is dropped without an error. The twelve themes,
# as six families:
#
#   default        Studio Light   — white cards on a lilac-grey canvas
#   dark           Studio Dark    — the same skeleton over a near-black canvas
#   bright         Bright Light   — warm paper, ink navy, acid green marker
#   bright-dark    Bright Dark    — the same pair with the roles swapped
#   frost          Frost Light    — slate-grey paper, teal accent
#   frost-dark     Frost Dark     — that teal over a deep blue-slate canvas
#   graphite       Graphite Light — monochrome: the accent is the ink itself
#   graphite-dark  Graphite Dark  — the same, inverted to a near-white accent
#   ember          Ember Light    — warm paper, copper accent
#   ember-dark     Ember Dark     — charcoal, with that copper lifted to amber
#   nocturne       Nocturne Light — cool white, blue-grey ink, a blurple accent
#   nocturne-dark  Nocturne Dark  — the design's own ground: a blue-grey near-
#                                   black, with the same blurple lifted a step
#
# The modes compose rather than repeat: a family mode is selected by both of
# its themes and `dark` by every dark one (order in terrazzo.config.mjs
# decides ties), so a `<family>-dark` mode carries only what is true of that
# corner alone — and Frost, whose teal reads correctly in both directions,
# needs no such mode for its ramp at all.
#
# The imported themes — Omarchy's and the desktops' — write nothing here.
# Their modes are derived from `themes/*.yaml` by `scripts/themes.mjs` and
# added to these tokens before the graph is parsed, so the file only ever
# shows the families that were drawn.
color:
  primary:
    "50":
      $value: "{base.color.brand.50}"
      $extensions:
        mode:
          bright: "{base.color.ink.50}"
          bright-dark: "{base.color.acid.50}"
          frost: "{base.color.frost.50}"
          graphite: "{base.color.graphite.50}"
          graphite-dark: "{base.color.graphite-dark.50}"
          ember: "{base.color.ember.50}"
          ember-dark: "{base.color.ember-dark.50}"
          nocturne: "{base.color.nocturne.50}"
    "100":
