  # The plate the whole app sits on, behind any window or panel. It is the
  # one surface the design cannot be read off — the mockups float on a
  # decorative gradient rather than on a desktop — so each theme carries the
  # step below its own quietest chrome: Bright Dark continues its ladder's
  # own rail-to-paper interval one step under the rail, which lands it here.
  canvas:
    $type: color
    $value: "#eeecf6"
    $extensions:
      mode:
        dark: "#0a0b10"
        bright: "#e6eade"
        bright-dark: "#060b12"
        frost: "#e5edf0"
        frost-dark: "#070d11"
        graphite: "#e8e8ec"
        graphite-dark: "#08080a"
        ember: "#eae2d4"
        ember-dark: "#0c0906"
        nocturne: "#e7e7ef"
        nocturne-dark: "#101120"
  # The paper: windows, popovers, the raised panel inside a tray.
  surface:
    $type: color
    $value: "#ffffff"
    $extensions:
      mode:
        dark: "#0d0f14"
        bright: "#fbfaf7"
        bright-dark: "#0c141e"
        frost: "#ffffff"
        frost-dark: "#0d151a"
        graphite: "#ffffff"
        graphite-dark: "#0f0f12"
        ember: "#fffdf9"
        ember-dark: "#14100b"
        nocturne: "#ffffff"
        nocturne-dark: "#161826"
  # One step off the paper: the card, the panel, the toolbar, the popup's
  # inner row. Each value is the card the artboard draws: 4c's #f7f7fa with
  # a .08 edge and 4a's #12141a; 4b's cards are *white* on the warm paper and
  # 4e's are #141d29 on the columns and in the menubar popup. "Off" is away
  # from the paper in every theme, and Bright's is up where Studio's is down —
  # which is why this role and `surface-chrome` coincide in Bright Light: the
  # design draws its cards and its bars in the same white. The columns a
  # window is built out of are `surface-column`, not this. `surface-sunken`
  # is unaffected and still rises on a dark canvas — a groove is cut by
  # lightening there, which is a different question from which way a card
  # leans.
  surface-muted:
    $type: color
    $value: "#f7f7fa"
    $extensions:
      mode:
        dark: "#12141a"
        bright: "#ffffff"
        bright-dark: "#141d29"
        frost: "#f2f6f8"
        frost-dark: "#111a20"
        graphite: "#f6f6f8"
        graphite-dark: "#141417"
        ember: "#f6f1e8"
        ember-dark: "#191410"
        nocturne: "#f6f6fa"
        nocturne-dark: "#232532"
  # One step into the paper: the groove a progress bar, a segmented control
  # or a switch is cut into. Distinct from `surface-muted` because a track
  # that matches the card it sits on stops reading as a track.
  surface-sunken:
    $type: color
    $value: "#e3e3ec"
    $extensions:
      mode:
        dark: "#262a34"
        bright: "#e5e3db"
        bright-dark: "#1c2734"
        frost: "#dbe6ea"
        frost-dark: "#23333d"
        graphite: "#e2e2e7"
        graphite-dark: "#27272c"
        ember: "#e6ddcd"
        ember-dark: "#2f271e"
        nocturne: "#e2e2ec"
        nocturne-dark: "#2f313c"
  # The quietest wash there is: what a menu item, a toolbar glyph, a table row
  # or a neutral control takes under the pointer. It is an alpha of the ink
  # rather than a rung of its own — ink at 6% over paper, white at 7% over a
  # dark ground — for the reason every wash in this graph is: an opaque step
  # sat between `surface` and `surface-muted` was a visible hover on paper and
  # no hover at all inside a card or a sidebar, since it landed within a point
  # of the fill it was meant to lift off. A wash moves whatever it lands on by
  # the same amount. The artboards draw no hover state, so the alpha is the
  # design's own quietest fill (the .06–.07 it rules a row with) applied as a
  # wash, and no more.
  surface-subtle:
    $type: color
    $value: "#14162a0f"
    $extensions:
      mode:
        dark: "#ffffff12"
        bright: "#111c2e0f"
        bright-dark: "#f2f4ef12"
        frost: "#0e1f260f"
        frost-dark: "#ffffff12"
        graphite: "#17171b0f"
        graphite-dark: "#ffffff12"
        ember: "#241a110f"
        ember-dark: "#ffffff12"
        nocturne: "#23242e0f"
        nocturne-dark: "#e9e9ed12"
  # One step further in than `surface-muted` but shallower than the groove:
  # the well a segmented control's track or a resting pill-tab is cut into.
  # Without it those fills borrow a neighbour — the groove reads a full step
  # too dark, or the pill stops separating from the card it sits on.
  surface-inset:
    $type: color
    $value: "#f0f0f5"
    $extensions:
      mode:
        dark: "#1b1e26"
        bright: "#f0efe9"
        bright-dark: "#16202c"
        frost: "#ecf2f4"
        frost-dark: "#18262e"
        graphite: "#efeff2"
        graphite-dark: "#1c1c21"
        ember: "#f2ebdf"
        ember-dark: "#231d16"
        nocturne: "#eeeef5"
        nocturne-dark: "#292b31"
  # The lifted thumb inside a groove — the selected segment, a switch knob.
  # Always lighter than the track it rides in, which on a dark canvas means
  # stepping up rather than down.
  surface-raised:
    $type: color
    $value: "#ffffff"
    $extensions:
      mode:
        dark: "#3a3f4d"
        bright: "#ffffff"
        bright-dark: "#2a3644"
        frost: "#ffffff"
        frost-dark: "#374b57"
        graphite: "#ffffff"
        graphite-dark: "#3b3b43"
        ember: "#fffdf9"
        ember-dark: "#453a2d"
        nocturne: "#ffffff"
        nocturne-dark: "#3f424d"
  # The floating sheet: a menu, a select list, a dialog, a toast. On paper it
  # is the paper — 4c and 4b float their menubar popup and their dialog in
  # the window's own white, and the edge and the shadow do the separating.
  # On a dark canvas the design lifts the sheet one step, to the fill its
  # titlebar and cards take — 4a's #12141a, 4e's #111a26 — behind a .09 edge
  # and a deep shadow, and that step is the role: a dialog the colour of the
  # paper had nothing to say it was over it. The families with no artboard
  # take the same step, their card fill. A tooltip is not on this rung: it
  # stays on `surface-raised`, the brightest step, because it is a chip the
  # size of a word rather than a sheet.
  surface-overlay:
    $type: color
    $value: "#ffffff"
    $extensions:
      mode:
        dark: "#12141a"
        bright: "#fbfaf7"
        bright-dark: "#111a26"
        frost: "#ffffff"
        frost-dark: "#111a20"
        graphite: "#ffffff"
        graphite-dark: "#141417"
        ember: "#fffdf9"
        ember-dark: "#191410"
        nocturne: "#ffffff"
        nocturne-dark: "#232532"
  # The bars a window is built out of: a dialog's footer, a table's header,
  # a titlebar. Studio takes the strip one step back from the paper, the
  # same step a card takes, which is why it looks like `surface-muted` and
  # is not: Bright inverts the pair, and its bars are pure white on the warm
  # paper. A footer that borrowed the card fill would sit darker than the
  # body it closes in exactly the theme where it should sit lighter.
  surface-chrome:
    $type: color
    $value: "#f7f7fa"
    $extensions:
      mode:
        dark: "#12141a"
        bright: "#ffffff"
        bright-dark: "#111a26"
        frost: "#f2f6f8"
        frost-dark: "#111a20"
        graphite: "#f6f6f8"
        graphite-dark: "#141417"
        ember: "#f6f1e8"
        ember-dark: "#191410"
        nocturne: "#f6f6fa"
        nocturne-dark: "#1c1e2c"
  # The columns either side of the paper: the navigation sidebar, the aside
  # or inspector, a dock. A column is not a card, and the design draws them
  # apart: on 4c the nav is #fafafc beside a #ffffff paper and the cards on
  # it are #f7f7fa, and on 4a the nav and aside recede to #0a0c11 *under* the
  # #0d0f14 paper while the cards on them lift to #12141a. One role for both
  # left a card in a sidebar the colour of the sidebar. Bright's columns were
  # already the design's own nav and aside (#f4f3ee, #0a111a) and keep them;
  # the families with no artboard take their card fill, which is what they
  # painted before this role existed.
  surface-column:
    $type: color
    $value: "#fafafc"
    $extensions:
      mode:
        dark: "#0a0c11"
        bright: "#f4f3ee"
        bright-dark: "#0a111a"
        frost: "#f2f6f8"
        frost-dark: "#111a20"
        graphite: "#f6f6f8"
        graphite-dark: "#141417"
        ember: "#f6f1e8"
        ember-dark: "#191410"
        nocturne: "#f6f6fa"
        nocturne-dark: "#232532"

  # The ink ramp, cut to three steps. The design carries eight; the extra
  # five are all one-off scene labels, and a shared vocabulary that offers
  # eight near-identical greys only invites each component to pick a
  # different one.
  #
  # Bright derives its two quieter steps as alphas of the ink rather than as
  # separate greys, which is what lets the same pair sit over warm paper and
  # over navy without a value per surface.
  content:
    $type: color
    $value: "#12142a"
    $extensions:
      mode:
        dark: "#f2f3fa"
        bright: "#111c2e"
        bright-dark: "#f2f4ef"
        frost: "#0e1f26"
        frost-dark: "#eaf3f7"
        graphite: "#17171b"
        graphite-dark: "#f4f4f6"
        ember: "#241a11"
        ember-dark: "#f6efe4"
        nocturne: "#23242e"
        nocturne-dark: "#e9e9ed"
  # Between full ink and the muted step: idle navigation rows and the
  # unselected half of a segmented control — text that must stay clearly
  # legible while conceding the room to whatever is selected.
  content-secondary:
    $type: color
    $value: "#3c405c"
    $extensions:
      mode:
        dark: "#c3c8dc"
        bright: "#111c2ec7"
        bright-dark: "#f2f4efc7"
        frost: "#2f4c58"
        frost-dark: "#bcd0d9"
        graphite: "#3d3d45"
        graphite-dark: "#c9c9d0"
        ember: "#4b3a2b"
        ember-dark: "#d5c6b4"
        nocturne: "#383a49"
        nocturne-dark: "#cfd3e5"
  # Named for where it is used rather than for a rung on the ladder, because
  # that is what it is: the ink a navigation row is set in while it is not the
  # current one. It sits between `content-secondary` and `content-muted` and
  # neither substitutes — a sidebar set in the first reads heavier than the
  # design, and in the second the rows go quiet enough to look disabled.
  #
  # Studio Dark is the deliberate exception: it writes `content-muted`'s
  # value, one ink for both roles, because the compressed dark ladder has no
  # step between them worth a third grey. The roles stay separate so the
  # themes that do separate them can.
  content-nav:
    $type: color
    $value: "#4a4f6b"
    $extensions:
      mode:
        dark: "#9aa1bb"
        bright: "#111c2eb3"
        bright-dark: "#f2f4efb3"
        frost: "#3a5b68"
        frost-dark: "#93aab5"
        graphite: "#4c4c56"
        graphite-dark: "#9d9da6"
        ember: "#5b4839"
        ember-dark: "#ab9886"
        nocturne: "#4c4e61"
        nocturne-dark: "#b2b6ca"
  content-muted:
    $type: color
    $value: "#565b78"
    $extensions:
      mode:
        dark: "#9aa1bb"
        bright: "#111c2ea8"
        bright-dark: "#f2f4efa8"
        frost: "#456573"
        frost-dark: "#93aab5"
        graphite: "#57575f"
        graphite-dark: "#9d9da6"
        ember: "#6a5747"
        ember-dark: "#ab9886"
        nocturne: "#63667d"
        nocturne-dark: "#9397ab"
  # The labelling step: section labels, field captions, hints, empty-state
  # lines. Quieter than `content-muted` — a caption printed in the muted step
  # competes with the value it captions.
  content-subtle:
    $type: color
    $value: "#8c92aa"
    $extensions:
      mode:
        dark: "#8b93b0"
        bright: "#111c2e73"
        bright-dark: "#f2f4ef73"
        frost: "#7794a0"
        frost-dark: "#7f99a4"
        graphite: "#8a8a93"
        graphite-dark: "#8a8a93"
        ember: "#96867a"
        ember-dark: "#94806d"
        nocturne: "#85889e"
        nocturne-dark: "#75798c"
  content-faint:
    $type: color
    $value: "#a2a7bd"
    $extensions:
      mode:
        dark: "#6a7090"
        bright: "#111c2e61"
        bright-dark: "#f2f4ef61"
        frost: "#9ab1ba"
        frost-dark: "#62808d"
        graphite: "#a3a3ab"
        graphite-dark: "#6a6a73"
        ember: "#b0a294"
        ember-dark: "#71604f"
        nocturne: "#adafc1"
        nocturne-dark: "#595d6c"
  # Separators are an alpha of the ink, not a grey, so one hairline reads the
  # same over a card, a sidebar and a popover without a value per surface.
  # Studio and Bright take the alpha their artboards rule with: a row or a
  # column edge on 4c is the ink at .06–.07 and on 4b at .07–.08, and on the
  # dark boards white at .05–.06 and the paper ink at .07–.08 — so 7% and 8%
  # over paper, 6% and 8% over the dark ground. Nocturne's are read off its
  # own mockups, ink at 13% over paper and 16% over the dark ground, and the
  # three families with no artboard keep those heavier numbers, since a
  # hairline is the one place the two designs the system is drawn to
  # disagree, and each family follows the one it was read from.
  border:
    $type: color
    $value: "#14162a12"
    $extensions:
      mode:
        dark: "#ffffff0f"
        bright: "#111c2e14"
        bright-dark: "#f2f4ef14"
        frost: "#0e1f2621"
        frost-dark: "#ffffff29"
        graphite: "#17171b21"
        graphite-dark: "#ffffff29"
        ember: "#241a1121"
        ember-dark: "#ffffff29"
        nocturne: "#23242e21"
        nocturne-dark: "#e9e9ed29"
  # The heavier hairline a floating surface is edged with — dialog, menu,
  # toast, and the card's own edge. A popover cut with the inline separator
  # weight stops separating from what it floats over, so this one keeps its
  # rung above `border`: on 4a, 4c, 4b and 4e a window, a card or a dialog is
  # edged at .08–.09 where a row is ruled at .06–.07, so Studio and Bright
  # take 9%; Nocturne and the families read beside it keep 17% over paper and
  # 20% over the dark ground, the same step above their heavier rule. That
  # lands it beside the opaque `border-muted` a control is outlined in rather
  # than under it, which is right: on a dark ground a dialog's edge and a
  # checkbox's outline are the same weight, and what tells them apart is that
  # only one of them is a control.
  border-strong:
    $type: color
    $value: "#14162a17"
    $extensions:
      mode:
        dark: "#ffffff17"
        bright: "#111c2e17"
        bright-dark: "#f2f4ef17"
        frost: "#0e1f262b"
        frost-dark: "#ffffff33"
        graphite: "#17171b2b"
        graphite-dark: "#ffffff33"
        ember: "#241a112b"
        ember-dark: "#ffffff33"
        nocturne: "#23242e2b"
        nocturne-dark: "#e9e9ed33"
  # The drawn outline of an unselected checkbox, radio or step marker, and
  # the rule under a divider. Heavier than a hairline on purpose: this one is
  # a control's edge rather than a separation between regions, and the
  # artboards draw it in the muted *ink*, not a pale grey — 4c's radios and
  # checkboxes are 1.5px #5f6478 and 4a's #363c4d — so an unticked box reads
  # as a control at rest rather than as a ghost of one. The three families
  # with no artboard take their own muted ink for the same reason; Nocturne
  # keeps the rung its mockups draw.
  border-muted:
    $type: color
    $value: "#5f6478"
    $extensions:
      mode:
        dark: "#363c4d"
        bright: "#111c2e40"
        bright-dark: "#35414f"
        frost: "#456573"
        frost-dark: "#32454f"
        graphite: "#57575f"
        graphite-dark: "#38383f"
        ember: "#6a5747"
        ember-dark: "#443a2d"
        nocturne: "#d8d9e4"
        nocturne-dark: "#3f424d"
  # What is printed on a filled accent control. White on the Studio violet;
  # in Bright the primary action is ink navy printed with acid green, and
  # Bright Dark is that exact pair inverted. This is a role rather than a
  # constant precisely because those two disagree — a filled button that
  # hardcoded white would be illegible on Bright Dark's acid fill.
  on-accent:
    $type: color
    $value: "#ffffff"
    $extensions:
      mode:
        bright: "#d6ff3f"
        bright-dark: "#111c2e"
        frost: "#ffffff"
        frost-dark: "#04171d"
        graphite: "#fafafa"
        graphite-dark: "#131316"
        ember: "#fffaf3"
        ember-dark: "#241206"
        nocturne: "#ffffff"
        nocturne-dark: "#161826"
control:
  color:
    # The interactive recipes. Three reading rules:
    #
    # 1. Washes are alphas of the tint, not opaque ramp steps — a `tinted`
    #    chip is the tint at 12%, a `plain` hover the tint at 8% — so the
    #    same wash sits correctly on paper, on a card, and on a dark canvas
    #    without per-theme steps.
    # 2. Accent *text* is a grade darker than accent *fill*: content reads
    #    700 where surface fills 600, and deepens to 800 on hover. On a dark
    #    canvas those grades come off the light end instead (300/200).
    # 3. Disabled flattens to the groove: `surface-sunken` fill,
    #    `content-faint` text, no border — one dead look shared by every
    #    variant, rather than a translucent ghost of the live one.
    #
    # `recessed` is the workhorse neutral: the grey chip a toolbar button or
    # default action is, one step deeper than the paper it sits on.
    #
    # Only the decisions are written. Before the graph is parsed,
    # `scripts/recipes.mjs` fills in every cell a variant leaves out, by
    # rules that never vary; what they fill in with is the data under
    # `$defaults`, which is consumed there and never reaches the graph:
    #
    #   hovered   unwritten → the same as `normal`
    #   pressed   unwritten → `hovered` with `$defaults.pressed` laid over it
    #   disabled  unwritten → `$defaults.disabled` for that part
    #   a part    unwritten → `$defaults.undrawn` in every state: the border
    #                         a filled button does not have
    #   a shade with no alpha is opaque
    #
    # The plugins then read the full table — six variants by three parts by
    # four states — so a rule is decided here and applied once rather than
    # re-derived in each platform generator. A wash that deepens on press
    # (`tinted`, `outlined`, `plain`) is a decision of its own and is
    # written; a cell that is only the rule applied is not.
    $type: color
    $defaults:
      # The one press signal every variant shares: the whole control —
      # surface, content, border alike — dims to `control.pressed.alpha`
      # while the pointer is down.
      pressed:
        alpha:
          $type: number
          $value: "{control.pressed.alpha}"
      disabled:
        surface:
          color:
            $value: "{color.surface-sunken}"
        content:
          color:
            $value: "{color.content-faint}"
        border:
          color:
            $value: "{base.color.transparent}"
      undrawn:
        color:
          $value: "{base.color.transparent}"
    normal:
      surface:
        normal:
          color:
            $value: "{color.surface}"
        hovered:
          color:
            $value: "{color.surface-subtle}"
      content:
        normal:
          color:
            $value: "{color.content}"
      border:
        normal:
          color:
            $value: "{color.border-strong}"
    recessed:
      surface:
        normal:
          color:
            $value: "{color.surface-inset}"
        hovered:
          color:
            $value: "{color.surface-sunken}"
      content:
        normal:
          color:
            $value: "{color.content}"
    filled:
      surface:
        normal:
          $type: number
          shade:
            $value: 600
            $extensions:
              mode:
                dark: 500
        hovered:
          $type: number
          shade:
            $value: 700
            $extensions:
              mode:
                dark: 600
      content:
        normal:
          color:
            $value: "{color.on-accent}"
    tinted:
      surface:
        normal:
          $type: number
          shade:
            $value: 600
          alpha:
            $value: 0.12
        hovered:
          $type: number
          shade:
            $value: 600
          alpha:
            $value: 0.2
        pressed:
          $type: number
          shade:
            $value: 600
          alpha:
            $value: 0.24
      content:
        normal:
          $type: number
          shade:
            $value: 700
            $extensions:
              mode:
                dark: 300
        hovered:
          $type: number
          shade:
            $value: 800
            $extensions:
              mode:
                dark: 200
    outlined:
      surface:
        normal:
          color:
            $value: "{base.color.transparent}"
        hovered:
          $type: number
          shade:
            $value: 600
          alpha:
            $value: 0.08
        pressed:
          $type: number
          shade:
            $value: 600
          alpha:
            $value: 0.12
      content:
        normal:
          $type: number
          shade:
            $value: 700
            $extensions:
              mode:
                dark: 300
        hovered:
          $type: number
          shade:
            $value: 800
            $extensions:
              mode:
                dark: 200
      border:
        normal:
          $type: number
          shade:
            $value: 600
            $extensions:
              mode:
                dark: 400
        hovered:
          $type: number
          shade:
            $value: 700
            $extensions:
              mode:
                dark: 300
    plain:
      surface:
        normal:
          color:
            $value: "{base.color.transparent}"
        hovered:
          $type: number
          shade:
            $value: 600
          alpha:
            $value: 0.08
        pressed:
          $type: number
          shade:
            $value: 600
          alpha:
            $value: 0.12
        # No groove for a control that never had a surface: a dead plain
        # button is quiet text, not a grey chip where none was.
        disabled:
          color:
            $value: "{base.color.transparent}"
      content:
        normal:
          $type: number
          shade:
            $value: 700
            $extensions:
              mode:
                dark: 300
        hovered:
          $type: number
          shade:
            $value: 800
            $extensions:
              mode:
                dark: 200
