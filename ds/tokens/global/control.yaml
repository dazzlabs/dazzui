# The shared control profile: one entry per size, carrying everything a
# sized control needs — box, icon, spacing, corner, and type. `plugins/control.mjs`
# binds each profile onto `[data-size]` as `--control-size`, `--control-gap`,
# `--control-icon-size`, `--control-padding-*`, `--control-radius`, and `--control-font-*` /
# `--control-line-height`, so a component stylesheet reads those shared
# variables once instead of restating them per size. A component that
# deviates overrides the bound variable with another token's variable in its
# own stylesheet — the profile is the default, not a cage.
#
# The heights are the macOS-to-Fluent control range the design draws to:
# 24 · 26 · 28 · 32. They come off `base.control-height` rather than off
# spacing,
# because 26px is not on the 4px grid and the set only stays in proportion
# when it is read as one scale.
#
# A profile is lengths, so the group says so once; the two leaves that are
# not — the press alpha, the type face — say what they are instead.
control:
  $type: dimension
  # The one press signal every variant shares: the whole control — surface,
  # content, border alike — dims to 90% while the pointer is down. The
  # recipes in color.yaml alias this instead of each writing 0.9, so the
  # press weight is decided once.
  pressed:
    alpha:
      $type: number
      $value: 0.9
  # The corner a box that grows with its content wears — a preference row, a
  # callout, a code block, a disclosure header. It is the regular control step,
  # because those boxes are drawn in the control's rhythm; Bright is the
  # exception, where that step is a pill — right for a box whose height sets its
  # curve, and wrong here, where the curve would stretch with the content
  # instead of staying a corner. So Bright re-picks a corner of its own: its
  # `xl`, the one finite step that family invented, rather than the shared
  # container step every other surface already wears — which would have drawn
  # this row at the card's corner and left Bright looking like the rest.
  #
  # Stated against the corner metrics rather than as an alias of one radius
  # step, the way the radius scale states its own steps: it is the one role
  # whose pick is not any single step's — `medium` in three families, `xl-bright`
  # in Bright — and an alias a theme re-picks cannot be carried by the native
  # generators, which resolve a mode to a stored member and need it to be a
  # value. (The CSS side could follow the alias; Dart, Swift and Rust cannot.)
  # The corner a text control's box wears — a field, a select, a combobox,
  # a number field, the one-time-code cells, a shortcut recorder: the family
  # that shares one box. It is the regular control corner in every drawn
  # family, and it is its own role for the families that draw buttons and
  # fields differently: Liquid Glass makes a button, a search field and a
  # segmented track a capsule and leaves a text field a rounded rectangle.
  # Stated against the corner metrics for the reason `container` is: an
  # alias a theme re-picks cannot be carried by the native generators.
  field:
    radius:
      $type: dimension
      $value: "{base.corner.md}"
      $extensions:
        mode:
          bright: 9999px
          graphite: "{base.corner.sm}"
          nocturne: "{base.corner.sm}"
  container:
    radius:
      $type: dimension
      $value: "{base.corner.md}"
      $extensions:
        mode:
          bright: "{base.corner.xl-bright}"
          graphite: "{base.corner.sm}"
          nocturne: "{base.corner.sm}"
  tiny:
    icon-size:
      $value: "{icon.small}"
    gap:
      $value: "{spacing.1}"
    padding:
      block:
        $value: "{spacing.1}"
      inline:
        $value: "{spacing.2.5}"
    size:
      $value: "{base.control-height.tiny}"
    radius:
      $value: "{radius.small}"
    content:
      $type: typography
      $value: "{labelSmall}"
  small:
    icon-size:
      $value: "{icon.medium}"
    gap:
      $value: "{spacing.1.5}"
    padding:
      block:
        $value: "{spacing.1}"
      inline:
        $value: "{spacing.3}"
    size:
      $value: "{base.control-height.small}"
    radius:
      $value: "{radius.small}"
    content:
      $type: typography
      $value: "{labelMedium}"
  medium:
    icon-size:
      $value: "{icon.medium}"
    gap:
      $value: "{spacing.2}"
    padding:
      block:
        $value: "{spacing.1.5}"
      inline:
        $value: "{spacing.4}"
    size:
      $value: "{base.control-height.medium}"
    radius:
      $value: "{radius.small}"
    content:
      $type: typography
      $value: "{labelMedium}"
  large:
    icon-size:
      $value: "{icon.large}"
    gap:
      $value: "{spacing.2}"
    padding:
      block:
        $value: "{spacing.1.5}"
      inline:
        $value: "{spacing.4}"
    size:
      $value: "{base.control-height.large}"
    radius:
      $value: "{radius.medium}"
    content:
      $type: typography
      $value: "{labelMedium}"
