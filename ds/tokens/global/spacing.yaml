# The 4px grid, declared here directly — the one scale the design keeps
# from Tailwind's conventions. It used to be a 1:1 forward of a generated
# base scale under the same names; a semantic layer that renames nothing
# is duplication, so the values live here and there is no base twin.
spacing:
  $type: dimension
  px:
    $value: 1px
  "0":
    $value: 0rem
  "0.5":
    $value: 0.125rem
  "1":
    $value: 0.25rem
  "1.5":
    $value: 0.375rem
  "2":
    $value: 0.5rem
  "2.5":
    $value: 0.625rem
  "3":
    $value: 0.75rem
  "3.5":
    $value: 0.875rem
  "4":
    $value: 1rem
  "5":
    $value: 1.25rem
  "6":
    $value: 1.5rem
  "7":
    $value: 1.75rem
  "8":
    $value: 2rem
  "9":
    $value: 2.25rem
  "10":
    $value: 2.5rem
  "11":
    $value: 2.75rem
  "12":
    $value: 3rem
  "14":
    $value: 3.5rem
  "16":
    $value: 4rem
  "20":
    $value: 5rem
