# The window chrome's own metrics. The corners live here rather than on
# `radius` because they belong to the frame the app is drawn in, not to
# anything a component rounds: they are a step larger than any container
# corner, and a component reaching for them would look like a window.
frame:
  window:
    radius:
      $type: dimension
      $value: "{base.corner.xl}"
      $extensions:
        mode:
          studio: "{base.corner.2xl}"
          graphite: "{base.corner.xl}"
          nocturne: "{base.corner.xl}"
    # The width a window opens at when the app names no size: a desktop
    # window is not as wide as its content, and the columns it holds — a
    # 172px sidebar, a rail, an aside — are what this was drawn around.
    width:
      $type: dimension
      $value: 52.5rem
  popover:
    radius:
      $type: dimension
      $value: "{base.corner.xl-bright}"
      $extensions:
        mode:
          studio: "{base.corner.xl}"
          graphite: "{base.corner.lg}"
          nocturne: "{base.corner.lg}"
  titlebar:
    size:
      $type: dimension
      $value: 3.25rem
  sidebar:
    width:
      $type: dimension
      $value: 10.75rem
    # The width a sidebar keeps once it has collapsed to its icons: one
    # medium row (28px) square, plus the group's 10px inset on either side.
    icon-width:
      $type: dimension
      $value: 3rem
  rail:
    width:
      $type: dimension
      $value: 9.375rem
  aside:
    width:
      $type: dimension
      $value: 13.375rem
  # The 3px rhythm between navigation rows — tighter than any grid step,
  # because a nav column is one object, not a list of controls.
  nav-gap:
    $type: dimension
    $value: 0.1875rem
