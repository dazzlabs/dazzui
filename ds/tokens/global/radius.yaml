# The corner scale, drawn from AppKit rather than from Tailwind's radii:
# `small` is a small control, `medium` a regular one, `large` a container,
# `big` a popover. Window and sheet corners are larger still and live on
# `frame`, since they belong to the chrome rather than to anything a
# component draws.
#
# Bright, the default, makes its controls full pills, and that is exactly why
# `medium` and `large` are separate axes rather than one shared corner: a pill
# is right for a box whose height sets the curve, and wrong for a container
# that grows with its content — a pill textarea reads as a lozenge. So the two
# control steps go round in Bright while the container steps stay finite;
# Studio's finite corners are the `studio` mode every other theme selects.
#
# Graphite goes the other way and is the reason this scale is re-pointed
# rather than rewritten: every step moves down exactly one rung of the same
# ladder, so the monochrome theme draws a crisper corner without inventing a
# measurement. `tiny` is where the ladder runs out and, like Bright, it is
# left alone — a chip at 7px is already the tightest corner the design has.
#
# Nocturne takes the same step down, for a different reason: the mockups it
# is drawn from round a row at 7 and a card at 8, which is exactly where
# Graphite's ladder lands, so it re-points the same rungs rather than
# carrying a third corner scale.
radius:
  $type: dimension
  none:
    $value: 0px
  # `tiny` carries no mode at all on purpose: the chip corner is the one
  # control step the pill default leaves alone, and Studio agrees with it.
  tiny:
    $value: "{base.corner.xs}"
  small:
    $value: 9999px
    $extensions:
      mode:
        studio: "{base.corner.sm}"
        graphite: "{base.corner.xs}"
        nocturne: "{base.corner.xs}"
  medium:
    $value: 9999px
    $extensions:
      mode:
        studio: "{base.corner.md}"
        graphite: "{base.corner.sm}"
        nocturne: "{base.corner.sm}"
  large:
    $value: "{base.corner.lg}"
    $extensions:
      mode:
        graphite: "{base.corner.md}"
        nocturne: "{base.corner.md}"
  big:
    $value: "{base.corner.xl-bright}"
    $extensions:
      mode:
        studio: "{base.corner.xl}"
        graphite: "{base.corner.lg}"
        nocturne: "{base.corner.lg}"
  full:
    $value: 9999px
