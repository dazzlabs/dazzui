# Alphas for washing a tint over a surface, as opposed to filling with a step
# off its ramp. A wash sits correctly on paper, on a card and on a dark canvas
# without a value per theme, which is why the design reaches for one wherever a
# tint has to tint something rather than become it.
#
# The weight depends on how much of it there is. The `tinted` control recipe
# fills a chip at 12% — right for something the size of a word — and the same
# alpha spread across a callout or a full-width row stops reading as a wash and
# becomes a block. `surface` is that larger area; `edge` is the hairline drawn
# around it.
wash:
  $type: number
  surface:
    $value: 0.06
  edge:
    $value: 0.2
