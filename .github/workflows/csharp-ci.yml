name: C# CI

on:
  pull_request:
    paths:
      - "packages/csharp/**"
      - ".github/workflows/csharp-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/csharp/**"
      - ".github/workflows/csharp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  winui-build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build packages/csharp/DazzUI/example/Playground.csproj
