name: Dart CI

# The Flutter package. A token or story change reaches it as a change to
# its committed generated files, which is what the paths below catch.
on:
  pull_request:
    paths:
      - "packages/dart/**"
      - ".github/workflows/dart-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/dart/**"
      - ".github/workflows/dart-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the pinned Flutter runtime
        shell: bash
        run: |
          # A release tag rather than a commit: `flutter` reads its own version
          # off a git tag, and a bare commit describes as `0.0.0-unknown`, which
          # pub then cannot solve `flutter_test`'s own SDK constraint against.
          git clone --depth 1 --branch 3.47.6 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Every story, in light and dark, and its interactions
        working-directory: packages/dart/dazzui/example
        run: flutter test test/stories_test.dart
      # What `dart-release.yml` would upload, validated on every change so a
      # release tag finds nothing new to complain about.
      - name: The archive pub.dev would receive
        working-directory: packages/dart/dazzui
        run: flutter pub publish --dry-run
