name: Rust CI

# The GPUI package. A token or story change reaches it as a change to its
# committed generated files, which is what the paths below catch.
on:
  pull_request:
    paths:
      - "packages/rust/**"
      - ".github/workflows/rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/rust/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpui:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/rust/dazzui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      # The runner's Xcode may lack the Metal toolchain; compiling the
      # shaders at launch draws the same thing.
      - run: cargo build --workspace --features runtime-shaders
      - run: cargo test --workspace --features runtime-shaders
