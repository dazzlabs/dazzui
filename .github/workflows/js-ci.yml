name: JS CI

# The design system and everything pnpm builds: ds, the React package and
# its example, and the tools. Flutter is installed because
# codegen formats the Dart it writes. It runs on a change
# to any package, since `codegen:check` holds the generated files of
# every one of them.
on:
  pull_request:
    paths:
      - "ds/**"
      - "packages/**"
      - "tools/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".oxfmtrc.json"
      - ".github/workflows/js-ci.yml"
  push:
    branches: [main]
    paths:
      - "ds/**"
      - "packages/**"
      - "tools/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".oxfmtrc.json"
      - ".github/workflows/js-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Install the pinned Flutter runtime
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin c8c5e3bd7542962ee8b09a12ac469d7d1ff823e0
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: npm install --global pnpm@11.24.0
      - run: flutter --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:check
      - run: pnpm codegen:test
      - run: pnpm components
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Build the React example from committed token sources
        run: pnpm example:build
      - name: Build the mobile example the same way
        run: pnpm mobile:build
