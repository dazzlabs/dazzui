name: Playgrounds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Install pinned formatting and Flutter runtimes
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin c8c5e3bd7542962ee8b09a12ac469d7d1ff823e0
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: npm install --global pnpm@11.24.0
      - run: flutter --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm playgrounds:check
      - run: pnpm playgrounds:test
      - run: pnpm components
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Build the React example from committed token sources
        run: pnpm --filter @dazzlabs/dazzui-react-playground exec vite build
      - run: pnpm --filter @dazzlabs/dazzui-react-playground exec playwright install --with-deps chromium
      - run: pnpm playground:test
      - name: Flutter shared checkpoints and gallery
        working-directory: packages/ui_flutter/example
        run: flutter test test/generated_scenes_test.dart test/playground_test.dart

      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playground-browser-diagnostics
          path: |
            packages/ui_react/example/playwright-report
            packages/ui_react/example/test-results
          retention-days: 7
          if-no-files-found: ignore

  winui-build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build packages/ui_winui3/example/Playground.csproj
