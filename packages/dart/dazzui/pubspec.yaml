name: dazzui
description: "The Flutter implementation of the DazzUI design system: the same tokens, themes and components as @dazzlabs/dazzui, drawn without Material."
version: 0.1.0
homepage: https://github.com/dazzlabs/dazzui
repository: https://github.com/dazzlabs/dazzui/tree/main/packages/dart/dazzui
issue_tracker: https://github.com/dazzlabs/dazzui/issues
topics:
  - design-system
  - ui
  - widget
  - theme

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.18.0
  # The three glyphs the kit draws itself — the search field's magnifier and
  # its dismiss, and the menu's tick. An icon set is the one thing a product
  # replaces wholesale, so every other glyph is a prop; these three are the
  # component rather than its content, and they come from the same set
  # `@dazzlabs/dazzui` takes them from (`@fluentui/react-icons`) so the two ports
  # draw one drawing.
  fluentui_system_icons: ^1.1.255
  flutter:
    sdk: flutter
  nativeapi: ^0.5.2

dev_dependencies:
  # A range rather than a caret: this is a dev dependency, and in a pub
  # workspace one member's floor is every member's. The package is linted
  # against 6 here; a host on 5 is not asked to move for it.
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
