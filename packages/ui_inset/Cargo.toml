[package]
name = "dazzui_inset"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "DazzUI design system for Inset"

[workspace]
members = ["example"]
resolver = "3"

[dependencies]
kurbo = "0.11.3"
inset-foundation = { path = "../../../inset/crates/inset-foundation" }
inset-embedder = { path = "../../../inset/crates/inset-embedder" }
inset-painting = { path = "../../../inset/crates/inset-painting" }
inset-rendering = { path = "../../../inset/crates/inset-rendering" }
inset-widgets = { path = "../../../inset/crates/inset-widgets" }
inset-gestures = { path = "../../../inset/crates/inset-gestures" }
inset-services = { path = "../../../inset/crates/inset-services" }
inset-animation = { path = "../../../inset/crates/inset-animation" }
inset-scheduler = { path = "../../../inset/crates/inset-scheduler" }
inset-cupertino = { path = "../../../inset/crates/inset-cupertino" }

[dev-dependencies]
valo-system-fonts = "0.4.4"

# Inset's renderer is large; keep local builds useful on ordinary laptops.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
