name: Playground
options:
  deploymentTarget:
    iOS: '16.0'
packages:
  DazzMobileUI:
    path: ..
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  Playground:
    type: application
    platform: iOS
    sources:
      - path: PlaygroundApp.swift
      - path: NativeControls.swift
    dependencies:
      - package: DazzMobileUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dazzlabs.dazzui.mobile.playground
        PRODUCT_NAME: DazzMobilePlayground
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DazzUI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Playground:
    build:
      targets:
        Playground: all
    run:
      config: Debug
