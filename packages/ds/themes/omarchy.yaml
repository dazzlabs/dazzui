# Omarchy's built-in themes, as the three colours each one's `colors.toml`
# in basecamp/omarchy decides everything else from: the background, the
# foreground and the accent. Omarchy's own shell (`shell/Commons/Style.qml`,
# `default/themed/shell.toml.tpl`) is built out of exactly these three — a
# fill is the foreground at an alpha over the background, a selection is the
# accent — which is what lets a DazzUI theme be read off the same three
# rather than off a screenshot. `scripts/themes.mjs` derives the rest.
#
# Each theme ships in the one appearance Omarchy gives it — `scheme` — and
# comes in both: `omarchy-<name>-<scheme>` is the theme as Omarchy draws it,
# to the digit, and the other mode is derived from the same three colours
# (`opposite` below; see `bothModes` in `scripts/themes.mjs`). The derived
# half is DazzUI's reading of the theme, not Omarchy's.

# Hyprland's `rounding = 0`, which Omarchy's shell mirrors in its
# `cornerRadius`: a button, a field, a card, a popover and a window are all
# cut square. `radius.full` is left alone, so what is round by nature — a
# radio, a switch's thumb — stays round.
metrics:
  omarchy:
    radius.tiny: 0px
    radius.small: 0px
    radius.medium: 0px
    radius.large: 0px
    radius.big: 0px
    frame.window.radius: 0px
    frame.popover.radius: 0px
    control.container.radius: 0px
    control.field.radius: 0px
    checkbox.radius: 0px

defaults:
  metrics: omarchy
  opposite: true

themes:
