radio:
  thickness:
    $type: dimension
    $value: "{stroke.control}"
  small:
    box:
      $type: dimension
      $value: "{spacing.3.5}"
    dot:
      $type: dimension
      $value: 0.375rem
  medium:
    box:
      $type: dimension
      $value: "{spacing.4}"
    dot:
      $type: dimension
      $value: 0.4375rem
  large:
    box:
      $type: dimension
      $value: "{spacing.5}"
    dot:
      $type: dimension
      $value: 0.5625rem
