# The shared control profile: one entry per size, carrying everything a
# sized control needs — box, spacing, corner, and type. `plugins/control.mjs`
# binds each profile onto `[data-size]` as `--control-size`, `--control-gap`,
# `--control-padding-*`, `--control-radius`, and `--control-font-*` /
# `--control-line-height`, so a component stylesheet reads those nine
# variables once instead of restating them per size. A component that
# deviates overrides the bound variable with another token's variable in its
# own stylesheet — the profile is the default, not a cage.
#
# The heights are the macOS-to-Fluent control range the design draws to:
# 24 · 26 · 28 · 32. They come off `base.control-height` rather than off
# spacing,
# because 26px is not on the 4px grid and the set only stays in proportion
# when it is read as one scale.
control:
  # The one press signal every variant shares: the whole control — surface,
  # content, border alike — dims to 90% while the pointer is down. The
  # recipes in color.yaml alias this instead of each writing 0.9, so the
  # press weight is decided once.
  pressed:
    alpha:
      $type: number
      $value: 0.9
  tiny:
    gap:
      $type: dimension
      $value: "{spacing.1}"
    padding:
      block:
        $type: dimension
        $value: "{spacing.1}"
      inline:
        $type: dimension
        $value: "{spacing.2.5}"
    size:
      $type: dimension
      $value: "{base.control-height.tiny}"
    radius:
      $type: dimension
      $value: "{radius.small}"
    content:
      $type: typography
      $value: "{labelSmall}"
  small:
    gap:
      $type: dimension
      $value: "{spacing.1.5}"
    padding:
      block:
        $type: dimension
        $value: "{spacing.1}"
      inline:
        $type: dimension
        $value: "{spacing.3}"
    size:
      $type: dimension
      $value: "{base.control-height.small}"
    radius:
      $type: dimension
      $value: "{radius.small}"
    content:
      $type: typography
      $value: "{labelMedium}"
  medium:
    gap:
      $type: dimension
      $value: "{spacing.2}"
    padding:
      block:
        $type: dimension
        $value: "{spacing.1.5}"
      inline:
        $type: dimension
        $value: "{spacing.4}"
    size:
      $type: dimension
      $value: "{base.control-height.medium}"
    radius:
      $type: dimension
      $value: "{radius.small}"
    content:
      $type: typography
      $value: "{labelMedium}"
  large:
    gap:
      $type: dimension
      $value: "{spacing.2}"
    padding:
      block:
        $type: dimension
        $value: "{spacing.1.5}"
      inline:
        $type: dimension
        $value: "{spacing.4}"
    size:
      $type: dimension
      $value: "{base.control-height.large}"
    radius:
      $type: dimension
      $value: "{radius.medium}"
    content:
      $type: typography
      $value: "{labelMedium}"
