# The primitive layer — the only place a raw *palette* value exists. (The
# semantic layer holds raw values of its own kind: each theme's paper, ink
# and shadow are decided there, because deciding them is that layer's job.
# What never appears outside this file is a hue's ladder.)
#
# Hand-authored, all of it. The generated Tailwind import this file began as
# is gone: the design is drawn to BeyondTranslate now, so there is no
# upstream to track, and what Tailwind actually contributed has been frozen
# here at the values it had — the five semantic hues below, at the 8-digit
# hex the platforms ship. Everything else is the design's own.
#
# Components must never reference `base.*` directly; the semantic files
# alias into it, and that indirection is what a theme re-points.
base:
  color:
    $type: color
    white:
      $value: "#ffffff"
    black:
      $value: "#000000"
    # The absent color: what a recipe names when a part is not drawn — the
    # border a filled button does not have. Naming it keeps the recipes free
    # of the "white at alpha zero" spelling, which said the same thing in
    # six lines and a lie.
    transparent:
      $value: "#00000000"
    # The brand violet. Every accent value the design specifies lands on a
    # step of this ramp, which is why the interactive recipes can keep
    # indexing it by shade: 600 is the resting accent, 700 the hover, 800
    # the strong accent text, and 500/300/200 are the same three roles as
    # they are used on a dark canvas.
    brand:
      "50":
        $value: "#f4f1fe"
      "100":
        $value: "#e6dfff"
      "200":
        $value: "#cdc0ff"
      "300":
        $value: "#b9a8ff"
      "400":
        $value: "#9a82ff"
      "500":
        $value: "#7c5cff"
      "600":
        $value: "#6b4dff"
      "700":
        $value: "#5b3fe0"
      "800":
        $value: "#4c33cc"
      "900":
        $value: "#3d2aa3"
      "950":
        $value: "#2a1c6b"
    # The two Bright accent ladders. Read them as a state ladder rather than
    # as a lightness ramp: `ink` runs *lighter* from 600 to 700 because the
    # Bright primary action is ink navy whose hover lifts, and its 50–200
    # steps are acid-tinted washes rather than pale navy, because that is
    # what the design tints a selected row with. A ramp is only ever indexed
    # by the recipes, and each step is a role — which is what lets a theme
    # this different reuse the same recipe table untouched.
    ink:
      "50":
        $value: "#f6fae2"
      "100":
        $value: "#f1f7d2"
      "200":
        $value: "#e6f77a"
      "300":
        $value: "#d6ff3f"
      "400":
        $value: "#8fa06a"
      "500":
        $value: "#3d5470"
      "600":
        $value: "#111c2e"
      "700":
        $value: "#1c2a41"
      "800":
        $value: "#263449"
      "900":
        $value: "#0b1420"
      "950":
        $value: "#060b12"
    # Bright Dark's accent, the exact inversion: acid green fills and ink
    # navy is printed on it. The dark recipes read 500 for a filled surface
    # and 300 for tinted text, so those carry the acid itself.
    acid:
      "50":
        $value: "#f6fae2"
      "100":
        $value: "#f1f7d2"
      "200":
        $value: "#e9ff8f"
      "300":
        $value: "#d6ff3f"
      "400":
        $value: "#b8e034"
      "500":
        $value: "#d6ff3f"
      "600":
        $value: "#c2ea2c"
      "700":
        $value: "#a8cc22"
      "800":
        $value: "#4a5c14"
      "900":
        $value: "#24310f"
      "950":
        $value: "#1a2410"
    # The semantic hues. Red, green and amber are the design's own — anchored
    # at its exact 600/700/800 text grades and 50 wash surfaces, with the
    # unanchored steps interpolated between them. Neutral and sky remain the
    # values Tailwind shipped when the design settled; all of it is data, not
    # a dependency.
    # Neutral and sky are written in the hex the platforms already ship:
    # the Dart, Swift and Rust outputs collapse every color to 8-digit hex,
    # and the CSS was leaving these two ramps in oklch — the one place the
    # platforms could disagree by a rounding step. Hex is the precision the
    # design ships at (see `legacyHex` in terrazzo.config.mjs), so it is
    # what the source says too.
    neutral:
      "50":
        $value: "#fafafa"
      "100":
        $value: "#f5f5f5"
      "200":
        $value: "#e5e5e5"
      "300":
        $value: "#d4d4d4"
      "400":
        $value: "#a1a1a1"
      "500":
        $value: "#737373"
      "600":
        $value: "#525252"
      "700":
        $value: "#404040"
      "800":
        $value: "#262626"
      "900":
        $value: "#171717"
      "950":
        $value: "#0a0a0a"
    red:
      "50":
        $value: "#fdf2f2"
      "100":
        $value: "#f9e2e2"
      "200":
        $value: "#f2c1c1"
      "300":
        $value: "#eba1a1"
      "400":
        $value: "#e48181"
      "500":
        $value: "#dd6060"
      "600":
        $value: "#d64040"
      "700":
        $value: "#c4342f"
      "800":
        $value: "#7e1f1c"
      "900":
        $value: "#4b1210"
      "950":
        $value: "#310b0a"
    green:
      "50":
        $value: "#e9f5ef"
      "100":
        $value: "#d7ede2"
      "200":
        $value: "#b2ddc7"
      "300":
        $value: "#8dcdad"
      "400":
        $value: "#68bd93"
      "500":
        $value: "#44ad78"
      "600":
        $value: "#1f9d5e"
      "700":
        $value: "#177d4a"
      "800":
        $value: "#105b37"
      "900":
        $value: "#093924"
      "950":
        $value: "#06281a"
    amber:
      "50":
        $value: "#fdf6ea"
      "100":
        $value: "#fef1de"
      "200":
        $value: "#ffe6c7"
      "300":
        $value: "#f7d1a0"
      "400":
        $value: "#f0bc78"
      "500":
        $value: "#e8a651"
      "600":
        $value: "#e0912a"
      "700":
        $value: "#b96f12"
      "800":
        $value: "#8a5210"
      "900":
        $value: "#573409"
      "950":
        $value: "#3d2506"
    # The dark-canvas companions of the three hues above. On a near-black
    # canvas the 300 and 500 steps brighten and saturate — a banner's text
    # and a status dot would otherwise sink into the ground — and every
    # other step holds the light ladder's value by alias. They are whole
    # ramps rather than two loose overrides because a platform that carries
    # a ramp as one swatch (Swift, Rust) can only move a ramp whole: two
    # stray hexes on the semantic layer never reached those platforms at
    # all.
    red-dark:
      "50":
        $value: "{base.color.red.50}"
      "100":
        $value: "{base.color.red.100}"
      "200":
        $value: "{base.color.red.200}"
      "300":
        $value: "#ff8f8f"
      "400":
        $value: "{base.color.red.400}"
      "500":
        $value: "#ff6b6b"
      "600":
        $value: "{base.color.red.600}"
      "700":
        $value: "{base.color.red.700}"
      "800":
        $value: "{base.color.red.800}"
      "900":
        $value: "{base.color.red.900}"
      "950":
        $value: "{base.color.red.950}"
    green-dark:
      "50":
        $value: "{base.color.green.50}"
      "100":
        $value: "{base.color.green.100}"
      "200":
        $value: "{base.color.green.200}"
      "300":
        $value: "#7fd7a8"
      "400":
        $value: "{base.color.green.400}"
      "500":
        $value: "#34d399"
      "600":
        $value: "{base.color.green.600}"
      "700":
        $value: "{base.color.green.700}"
      "800":
        $value: "{base.color.green.800}"
      "900":
        $value: "{base.color.green.900}"
      "950":
        $value: "{base.color.green.950}"
    amber-dark:
      "50":
        $value: "{base.color.amber.50}"
      "100":
        $value: "{base.color.amber.100}"
      "200":
        $value: "{base.color.amber.200}"
      "300":
        $value: "#ffcf9c"
      "400":
        $value: "{base.color.amber.400}"
      "500":
        $value: "#ffb86b"
      "600":
        $value: "{base.color.amber.600}"
      "700":
        $value: "{base.color.amber.700}"
      "800":
        $value: "{base.color.amber.800}"
      "900":
        $value: "{base.color.amber.900}"
      "950":
        $value: "{base.color.amber.950}"
    sky:
      "50":
        $value: "#f0f9ff"
      "100":
        $value: "#dff2fe"
      "200":
        $value: "#b8e6fe"
      "300":
        $value: "#74d4ff"
      "400":
        $value: "#00bcff"
      "500":
        $value: "#00a6f4"
      "600":
        $value: "#0084d1"
      "700":
        $value: "#0069a8"
      "800":
        $value: "#00598a"
      "900":
        $value: "#024a70"
      "950":
        $value: "#052f4a"
  font-weight:
    $type: fontWeight
    thin:
      $value: 100
    extralight:
      $value: 200
    light:
      $value: 300
    normal:
      $value: 400
    medium:
      $value: 500
    semibold:
      $value: 600
    bold:
      $value: 700
    extrabold:
      $value: 800
    black:
      $value: 900
  # Corners, keyed to Sonoma/Sequoia rather than the tighter Big Sur metrics.
  # Controls sit around 10px and containers around 12px; the two are separate
  # steps rather than one shared value because a theme may legitimately make
  # a control a full pill, and a container that followed it would turn into a
  # lozenge as it grew.
  corner:
    $type: dimension
    # 7px — the chip corner: badges, key caps, the capsule nested inside a
    # segmented track. The design has no 4px corner anywhere.
    xs:
      $value: 0.4375rem
    sm:
      $value: 0.5rem
    md:
      $value: 0.625rem
    lg:
      $value: 0.75rem
    xl:
      $value: 1rem
    # 14px — the xl corner as Bright draws it. The pill theme pulls its
    # floating surfaces one notch tighter than Studio's, and both takers
    # (`radius.big`, `frame.popover`) point here rather than each writing
    # the measurement down.
    xl-bright:
      $value: 0.875rem
    2xl:
      $value: 1.125rem
  # AppKit's practical type scale: 11 secondary · 12 small · 13 body ·
  # 15 emphasis · 17 title. The larger steps carry on past what AppKit
  # specifies, for the display and headline faces the desktop chrome does not
  # use but a marketing surface does.
  type:
    $type: dimension
    caption:
      $value: 0.6875rem
    small:
      $value: 0.75rem
    body:
      $value: 0.8125rem
    emphasis:
      $value: 0.9375rem
    title:
      $value: 1.0625rem
    xl:
      $value: 1.25rem
    2xl:
      $value: 1.5rem
    3xl:
      $value: 1.75rem
    4xl:
      $value: 2.125rem
    5xl:
      $value: 2.5rem
    6xl:
      $value: 3rem
  # The comfortable line-height paired with each type step, for text that
  # wraps. A control's label does not wrap and sets its line-height to its
  # own size instead, by aliasing `base.type` for both — which is why this
  # set has no tight variant.
  leading:
    $type: dimension
    caption:
      $value: 0.875rem
    small:
      $value: 1.125rem
    body:
      $value: 1.25rem
    emphasis:
      $value: 1.375rem
    title:
      $value: 1.375rem
    xl:
      $value: 1.625rem
    2xl:
      $value: 1.875rem
    3xl:
      $value: 2.125rem
    4xl:
      $value: 2.5rem
    5xl:
      $value: 2.875rem
    6xl:
      $value: 3.375rem
  # The control heights, as their own scale rather than as spacing steps:
  # 26px is not on the 4px grid, and reading the set as one scale is what
  # keeps the sizes in proportion to each other.
  control-height:
    $type: dimension
    tiny:
      $value: 1.5rem
    small:
      $value: 1.625rem
    medium:
      $value: 1.75rem
    large:
      $value: 2rem
  # Apple-first stacks. `ui` is the interface face, `display` the tighter cut
  # for large text, `mono` for keys and code.
  font:
    $type: fontFamily
    ui:
      $value:
        - -apple-system
        - SF Pro Text
        - system-ui
        - PingFang SC
        - sans-serif
    display:
      $value:
        - -apple-system
        - SF Pro Display
        - system-ui
        - PingFang SC
        - sans-serif
    code:
      $value:
        - ui-monospace
        - SF Mono
        - Menlo
        - monospace
