# The hand-authored half of the primitive layer.
#
# `_base.yaml` is generated from Tailwind's theme.css and holds the scales
# Tailwind supplies. This file holds the primitives it does not: the brand
# ramp, and the AppKit metrics the design is drawn to. Both files sit at the
# same layer — semantic tokens alias either one, and neither is read by a
# component directly.
#
# The namespaces avoid Tailwind's on purpose. `base.corner` is not
# `base.radius`, and `base.type` is not `base.text`, because these are a
# different scale rather than a re-spelling of that one, and a token that
# aliases the wrong scale should not be able to look right.
base:
  color:
    # The brand violet. Every accent value the design specifies lands on a
    # step of this ramp, which is why the interactive recipes can keep
    # indexing it by shade: 600 is the resting accent, 700 the hover, 800 the
    # strong accent text, and 500/300/200 are the same three roles as they
    # are used on a dark canvas.
    brand:
      $type: color
      "50":
        $value: "#f4f1fe"
      "100":
        $value: "#e6dfff"
      "200":
        $value: "#cdc0ff"
      "300":
        $value: "#b9a8ff"
      "400":
        $value: "#9a82ff"
      "500":
        $value: "#7c5cff"
      "600":
        $value: "#6b4dff"
      "700":
        $value: "#5b3fe0"
      "800":
        $value: "#4c33cc"
      "900":
        $value: "#3d2aa3"
      "950":
        $value: "#2a1c6b"
    # The two Bright accent ladders. Read them as a state ladder rather than
    # as a lightness ramp: `ink` runs *lighter* from 600 to 700 because the
    # Bright primary action is ink navy whose hover lifts, and its 50–200
    # steps are acid-tinted washes rather than pale navy, because that is
    # what the design tints a selected row with. A ramp is only ever indexed
    # by the recipes, and each step is a role — which is what lets a theme
    # this different reuse the same recipe table untouched.
    ink:
      $type: color
      "50":
        $value: "#f6fae2"
      "100":
        $value: "#f1f7d2"
      "200":
        $value: "#e6f77a"
      "300":
        $value: "#d6ff3f"
      "400":
        $value: "#8fa06a"
      "500":
        $value: "#3d5470"
      "600":
        $value: "#111c2e"
      "700":
        $value: "#1c2a41"
      "800":
        $value: "#263449"
      "900":
        $value: "#0b1420"
      "950":
        $value: "#060b12"
    # Bright Dark's accent, the exact inversion: acid green fills and ink
    # navy is printed on it. The dark recipes read 500 for a filled surface
    # and 300 for tinted text, so those carry the acid itself.
    acid:
      $type: color
      "50":
        $value: "#f6fae2"
      "100":
        $value: "#f1f7d2"
      "200":
        $value: "#e9ff8f"
      "300":
        $value: "#d6ff3f"
      "400":
        $value: "#b8e034"
      "500":
        $value: "#d6ff3f"
      "600":
        $value: "#c2ea2c"
      "700":
        $value: "#a8cc22"
      "800":
        $value: "#4a5c14"
      "900":
        $value: "#24310f"
      "950":
        $value: "#1a2410"
  # Corners, keyed to Sonoma/Sequoia rather than the tighter Big Sur metrics.
  # Controls sit around 10px and containers around 12px; the two are separate
  # steps rather than one shared value because a theme may legitimately make
  # a control a full pill, and a container that followed it would turn into a
  # lozenge as it grew.
  corner:
    $type: dimension
    xs:
      $value: 0.25rem
    sm:
      $value: 0.5rem
    md:
      $value: 0.625rem
    lg:
      $value: 0.75rem
    xl:
      $value: 1rem
    2xl:
      $value: 1.125rem
  # AppKit's practical type scale: 11 secondary · 12 small · 13 body ·
  # 15 emphasis · 17 title. The larger steps carry on past what AppKit
  # specifies, for the display and headline faces the desktop chrome does not
  # use but a marketing surface does.
  type:
    $type: dimension
    caption:
      $value: 0.6875rem
    small:
      $value: 0.75rem
    body:
      $value: 0.8125rem
    emphasis:
      $value: 0.9375rem
    title:
      $value: 1.0625rem
    xl:
      $value: 1.25rem
    2xl:
      $value: 1.5rem
    3xl:
      $value: 1.75rem
    4xl:
      $value: 2.125rem
    5xl:
      $value: 2.5rem
    6xl:
      $value: 3rem
  # The comfortable line-height paired with each type step, for text that
  # wraps. A control's label does not wrap and sets its line-height to its
  # own size instead, by aliasing `base.type` for both — which is why this
  # set has no tight variant.
  leading:
    $type: dimension
    caption:
      $value: 0.875rem
    small:
      $value: 1.125rem
    body:
      $value: 1.25rem
    emphasis:
      $value: 1.375rem
    title:
      $value: 1.375rem
    xl:
      $value: 1.625rem
    2xl:
      $value: 1.875rem
    3xl:
      $value: 2.125rem
    4xl:
      $value: 2.5rem
    5xl:
      $value: 2.875rem
    6xl:
      $value: 3.375rem
  # The control heights, as their own scale rather than as spacing steps:
  # 26px is not on the 4px grid, and reading the set as one scale is what
  # keeps the sizes in proportion to each other.
  control-height:
    $type: dimension
    tiny:
      $value: 1.5rem
    small:
      $value: 1.625rem
    medium:
      $value: 1.75rem
    large:
      $value: 2rem
    big:
      $value: 2.5rem
  # Apple-first stacks. `ui` is the interface face, `display` the tighter cut
  # for large text, `mono` for keys and code.
  font:
    $type: fontFamily
    ui:
      $value:
        - -apple-system
        - SF Pro Text
        - system-ui
        - PingFang SC
        - sans-serif
    display:
      $value:
        - -apple-system
        - SF Pro Display
        - system-ui
        - PingFang SC
        - sans-serif
    code:
      $value:
        - ui-monospace
        - SF Mono
        - Menlo
        - monospace
