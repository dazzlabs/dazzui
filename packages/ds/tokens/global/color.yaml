  # The three status ramps move whole onto their dark companions — every
  # step, not just the two the dark canvas lifts — because a platform that
  # carries a ramp as one swatch (Swift, Rust) can only re-point a ramp it
  # can re-point entirely. The unchanged steps cost nothing: they alias the
  # same values either way.
  success:
    "50":
      $value: "{base.color.green.50}"
      $extensions:
        mode:
          dark: "{base.color.green-dark.50}"
    "100":
