    "300":
      $value: "{base.color.amber.300}"
      $extensions:
        mode:
          dark: "{base.color.amber-dark.300}"
    "400":
      $value: "{base.color.amber.400}"
      $extensions:
        mode:
          dark: "{base.color.amber-dark.400}"
    "500":
      $value: "{base.color.amber.500}"
      $extensions:
        mode:
          dark: "{base.color.amber-dark.500}"
    "600":
      $value: "{base.color.amber.600}"
      $extensions:
        mode:
          dark: "{base.color.amber-dark.600}"
    "700":
      $value: "{base.color.amber.700}"
      $extensions:
