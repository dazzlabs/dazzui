# The type faces, drawn to AppKit's practical scale: 11 secondary ·
# 12 small · 13 body · 15 emphasis · 17 title, carried on past 17 for the
# headline and display faces the desktop chrome does not use.
#
# The `label` faces set their line-height to their own size. That is what a
# control wants — its label does not wrap, and a leading taller than the cap
# height pushes the text off the centre of a 26px box. Every other face pairs
# its size with the comfortable leading, because its text does wrap.
displaySmall:
  $type: typography
  $value:
    fontFamily: "{base.font.display}"
    fontSize: "{base.type.4xl}"
    fontWeight: "{base.font-weight.light}"
    lineHeight: "{base.leading.4xl}"
