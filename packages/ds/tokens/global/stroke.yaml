# Line weights. `hairline` is a separator, and it is one *CSS* pixel on every
# platform — the Nocturne mockups the system is drawn to rule every panel,
# row and field at 1px, and a rule halved to one device pixel on a Retina
# screen reads as half a decision. `control` is the drawn edge of an
# unselected checkbox, radio, idle step marker or selected option card: at
# 1.5px it sits between a hairline and a 2px slab, which is exactly the
# weight AppKit draws those outlines at.
stroke:
  $type: dimension
  hairline:
    $value: 1px
  control:
    $value: 0.09375rem
