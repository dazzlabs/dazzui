# The keyboard focus ring, drawn the way macOS draws it: a soft, wide accent
# halo hugging the control with no gap — not the crisp offset outline the web
# defaults to. `ring` is a recipe (a shade off the tinted ramp plus an
# alpha), resolved by plugins/control.mjs onto `[data-tint]` as
# `--focus-ring`, with a primary-tinted default on `:root` for anything that
# carries no tint of its own.
focus:
  width:
    $type: dimension
    $value: 3px
  offset:
    $type: dimension
    $value: 0px
  # The soft halo behind a focused text field, which is a different thing from
  # `ring`: the ring is the wide halo a button draws to say it has the
  # keyboard, this is the quiet lift a field already carrying a caret gives
  # itself. Three controls drew it at this weight before it had a name here.
  glow:
    alpha:
      $type: number
      $value: 0.14
  ring:
    shade:
      $type: number
      $value: 600
    alpha:
      $type: number
      $value: 0.45
      $extensions:
        mode:
          dark: 0.5
          bright-dark: 0.55
