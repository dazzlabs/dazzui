# The themable half of the colour vocabulary: the roles a theme re-points,
# with every theme's value carried inline as a mode.
#
# All four themes live in this one file, and that is a constraint rather than
# a preference. Terrazzo merges token files by replacing a whole token, not by
# deep-merging it: a second file re-declaring `color.surface` to add a mode
# replaces the first declaration outright, and a file carrying only
# `$extensions` is dropped without an error. Splitting the themes across files
# therefore loses all but the last, silently.
#
# The modes compose rather than repeat. `bright` is selected by both Bright
# themes and `dark` by both dark ones, so a value shared along either axis is
# written once; `bright-dark` then carries only what is true of that corner
# alone. The emission order is bright → dark → bright-dark, so the later block
# wins where two of them speak, which is why Bright Dark takes the dark
# surfaces rather than Bright Light's warm paper.
#
#   default      Studio Light — white cards on a lilac-grey canvas
#   dark         Studio Dark  — the same skeleton over a near-black canvas
#   bright       Bright Light — warm paper, ink navy, acid green marker
#   bright-dark  Bright Dark  — the same pair with the roles swapped
color:
  # The plate the whole app sits on, behind any window or panel.
  canvas:
    $type: color
    $value: "#eeecf6"
    $extensions:
      mode:
        dark: "#0a0b10"
        bright: "#e6eade"
        bright-dark: "#0a111a"
  # The paper: windows, popovers, the raised panel inside a tray.
  surface:
    $type: color
    $value: "#ffffff"
    $extensions:
      mode:
        dark: "#0d0f14"
        bright: "#fbfaf7"
        bright-dark: "#0c141e"
  # One step back from the paper: cards, sidebars, toolbars, table headers,
  # and the wash a neutral control takes under the pointer.
  surface-muted:
    $type: color
    $value: "#f7f7fa"
    $extensions:
      mode:
        dark: "#12141a"
        bright: "#f6f5f1"
        bright-dark: "#141d29"
  # One step into the paper: the groove a progress bar, a segmented control
  # or a toggle is cut into. Distinct from `surface-muted` because a track
  # that matches the card it sits on stops reading as a track.
  surface-sunken:
    $type: color
    $value: "#e3e3ec"
    $extensions:
      mode:
        dark: "#262a34"
        bright: "#e5e3db"
        bright-dark: "#1c2734"
  # The lifted thumb inside a groove — the selected segment, a toggle knob.
  # Always lighter than the track it rides in, which on a dark canvas means
  # stepping up rather than down.
  surface-raised:
    $type: color
    $value: "#ffffff"
    $extensions:
      mode:
        dark: "#3a3f4d"
        bright: "#ffffff"
        bright-dark: "#2a3644"
  # The ink ramp, cut to three steps. The design carries eight; the extra
  # five are all one-off scene labels, and a shared vocabulary that offers
  # eight near-identical greys only invites each component to pick a
  # different one.
  #
  # Bright derives its two quieter steps as alphas of the ink rather than as
  # separate greys, which is what lets the same pair sit over warm paper and
  # over navy without a value per surface.
  content:
    $type: color
    $value: "#12142a"
    $extensions:
      mode:
        dark: "#f2f3fa"
        bright: "#111c2e"
        bright-dark: "#f2f4ef"
  content-muted:
    $type: color
    $value: "#565b78"
    $extensions:
      mode:
        dark: "#9aa1bb"
        bright: "#111c2ea8"
        bright-dark: "#f2f4efa8"
  content-faint:
    $type: color
    $value: "#a2a7bd"
    $extensions:
      mode:
        dark: "#6a7090"
        bright: "#111c2e61"
        bright-dark: "#f2f4ef61"
  # Separators are an alpha of the ink, not a grey, so one hairline reads the
  # same over a card, a sidebar and a popover without a value per surface.
  border:
    $type: color
    $value: "#14162a12"
    $extensions:
      mode:
        dark: "#ffffff0f"
        bright: "#111c2e14"
        bright-dark: "#f2f4ef14"
  # The drawn outline of an unselected checkbox, radio or step marker, and
  # the rule under a divider. Heavier than a hairline on purpose: this one is
  # a control's edge rather than a separation between regions.
  border-muted:
    $type: color
    $value: "#cfd2de"
    $extensions:
      mode:
        dark: "#363c4d"
        bright: "#111c2e40"
        bright-dark: "#35414f"
  # What is printed on a filled accent control. White on the Studio violet;
  # in Bright the primary action is ink navy printed with acid green, and
  # Bright Dark is that exact pair inverted. This is a role rather than a
  # constant precisely because those two disagree — a filled button that
  # hardcoded white would be illegible on Bright Dark's acid fill.
  on-accent:
    $type: color
    $value: "#ffffff"
    $extensions:
      mode:
        bright: "#d6ff3f"
        bright-dark: "#111c2e"
