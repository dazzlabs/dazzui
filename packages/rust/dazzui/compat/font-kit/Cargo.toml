[package]
name = "zed-font-kit"
version = "0.14.1-zed.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "GPUI font-kit adapter for CSS system-font instances"

[dependencies]
upstream = { package = "zed-font-kit", git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21"
core-foundation = "0.10"

[features]
default = ["source"]
source = ["upstream/source"]
loader-freetype = ["upstream/loader-freetype"]
loader-freetype-default = ["upstream/loader-freetype-default"]
source-fontconfig = ["upstream/source-fontconfig"]
source-fontconfig-default = ["upstream/source-fontconfig-default"]
source-fontconfig-dlopen = ["upstream/source-fontconfig-dlopen"]
