# The GPUI implementation of the DazzUI design system.
#
# The example is a package of its own rather than an `[[example]]` target,
# for the reason the Flutter and SwiftUI examples are separate apps: the
# library carries no entry point, no window and no dependency only the
# example needs. It is a workspace member so the two share one lockfile and
# one `target/`.
[package]
name = "dazzui"
version = "0.1.0"
edition = "2024"
description = "The GPUI implementation of the DazzUI design system."
license = "MIT"
publish = false

[workspace]
members = ["example", "compat/font-kit"]
exclude = ["compat/gpui", "compat/taffy"]

[patch.crates-io]
gpui = { path = "compat/gpui" }
zed-font-kit = { path = "compat/font-kit" }
taffy = { path = "compat/taffy" }

[dependencies]
gpui = "0.2.2"
# A calendar's value is a date, and `chrono` is the date a Rust program has.
chrono = "0.4"
# Number editing accepts the same Unicode format controls as the source input.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
unicode-segmentation = "1"
# Optional: the native dropdown backend behind the `native-menus` feature.
# Same pin dazzdesk carries; the binding vendors the C++ core and builds it
# with CMake (Linux needs the gtk3, x11 and xi dev packages installed).
nativeapi = { version = "=0.5.2", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21"
objc = "0.2"
block = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
yeslogic-fontconfig-sys = { version = "6", features = ["dlopen"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[features]
# GPUI compiles its Metal shaders in a build script, which needs the Metal
# toolchain. Without it, this switches GPUI to compiling them at launch.
runtime-shaders = ["gpui/runtime_shaders"]
# Native dropdowns: Menu, ContextMenu, Menubar and Select hand their list to
# the OS popup through nativeapi when a `MenuPresentation::Native` scope is
# in force. Off (and unsupported platforms) keep the drawn sheet. Verified on
# macOS; Windows and Linux compile but are unverified here.
native-menus = ["dep:nativeapi", "dep:raw-window-handle"]
