[package]
name = "dazzui-nsh-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dazzui-nsh = { path = ".." }
nsh-core.workspace = true
nsh-base.workspace = true
serde.workspace = true
serde_json.workspace = true
env_logger = "0.11"

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.4.0", default-features = false }
[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.4.0", default-features = false }
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.4.0", default-features = false }
