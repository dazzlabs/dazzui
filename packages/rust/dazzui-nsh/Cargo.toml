[package]
name = "dazzui-nsh"
version = "0.1.0"
edition = "2024"
description = "DazzUI desktop components for Native Shell"
license = "MIT"
repository = "https://github.com/dazzlabs/dazzui"

[workspace]
members = ["example"]
exclude = ["vendor/nsh-platform-macos"]
resolver = "3"

[workspace.dependencies]
nsh-core = "=0.4.0"
nsh-base = { version = "=0.4.0", default-features = false }
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-testing = { version = "=0.4.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
nsh-core.workspace = true
nsh-base.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing.workspace = true
serde_json.workspace = true

# Keep native debug binaries small enough for the macOS compact unwind table.
[profile.dev]
debug = 1

# Until NSH preserves CSS numeric weights on the system variable font.
[patch.crates-io]
nsh-platform-macos = { path = "vendor/nsh-platform-macos" }
