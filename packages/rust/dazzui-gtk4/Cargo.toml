[package]
name = "dazzui-gtk4"
version = "0.1.0"
edition = "2024"
description = "The GTK4 implementation of the DazzUI design system"
license = "MIT"

[workspace]
members = ["example"]

[dependencies]
icu_collator = "2.4"
url = "2.5"
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
icu_datetime = "2.4"
icu_calendar = "2.4"
writeable = "0.6"

[dev-dependencies]
serde_json = "1"

[profile.dev]
debug = 0

[[test]]
name = "native"
path = "tests/native.rs"
harness = false
