[package]
name = "dazzui-gtk4"
version = "0.1.0"
edition = "2024"
description = "The GTK4 implementation of the DazzUI design system"
license = "MIT"

[workspace]
members = ["example"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }

[dev-dependencies]
serde_json = "1"

[profile.dev]
debug = 0

[[test]]
name = "native"
path = "tests/native.rs"
harness = false
