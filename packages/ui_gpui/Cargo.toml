# The DazzUI design system for GPUI — the platform sibling of
# `packages/ui_react`, `packages/ui_flutter` and `packages/ui_swiftui`. Same
# tokens, same four themes, same components.
#
# The playground is a package of its own rather than a `[[example]]` target,
# for the same reason the Flutter and SwiftUI examples are separate apps: the
# library must not carry an entry point, a window, or a dependency that only
# the playground needs. It is a workspace member so the two share one lockfile
# and one `target/`.
[package]
name = "dazzui"
version = "0.1.0"
edition = "2024"
description = "The GPUI implementation of the DazzUI design system."
publish = false

[workspace]
members = ["example"]

[dependencies]
gpui = "0.2.2"

[dev-dependencies]
# The headless half of GPUI: it draws an element tree without a window, which
# is what lets the tests lay out and paint every component.
gpui = { version = "0.2.2", features = ["test-support"] }
# The parity test reads the React reference, which is JSON.
serde_json = "1"

[features]
# GPUI compiles its Metal shaders in a build script, which needs the Metal
# toolchain (`xcodebuild -downloadComponent MetalToolchain`). On a Mac without
# it, this feature switches GPUI to compiling them at launch instead, which is
# the difference between the crate building and not. It changes nothing about
# what is drawn.
runtime-shaders = ["gpui/runtime_shaders"]
