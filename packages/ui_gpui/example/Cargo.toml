# The playground: six pages of components, drawn with the design system it
# documents. A package of its own rather than a target of the library, for
# the same reason the Flutter and SwiftUI examples are separate apps.
[package]
name = "dazzui_playground"
version = "0.1.0"
edition = "2024"
description = "The playground for the GPUI implementation of DazzUI."
publish = false

[dependencies]
dazzui = { path = ".." }
gpui = "0.2.2"

[features]
runtime-shaders = ["dazzui/runtime-shaders", "gpui/runtime_shaders"]

[[bin]]
name = "playground"
path = "src/main.rs"
