# The settings example's own components, added to the compiler's built-in
# ones. Each maps to DazzUI's preference controls; neither the compiler nor
# its backends know these names.

# The settings column: sections at the widest step, no wider than DazzUI's
# preferences width.
[component.Settings]
children = { allow = ["SettingsSection"] }

[component.Settings.swiftui]
call = "DazzUI.Preferences"
trailing = { children = true }

[component.Settings.winui]
element = "dazz:Preferences"
children = { property = "Sections" }

# A labelled run of rows, with an optional note under them. WinUI's section
# holds one element, so its rows go in a PreferenceGroup, which takes only
# rows: hence `allow`.
[component.SettingsSection]
positional = ["title"]
children = { allow = ["SettingsRow"] }
props.title = { type = "string" }
props.footer = { type = "string" }

[component.SettingsSection.swiftui]
call = "DazzUI.PreferenceSection"
args = [
  { arg = "label", prop = "title" },
  { arg = "footer", prop = "footer" },
]
trailing = { children = true }

[component.SettingsSection.winui]
element = "dazz:PreferenceSection"
attrs = [
  { attr = "Title", prop = "title" },
  { attr = "Footer", prop = "footer" },
]
children = { property = "Body", wrap = "dazz:PreferenceGroup", wrap_property = "Rows" }

# One preference: title and optional subtitle on the leading side, a control
# on the trailing one. The slot is passed by label: PreferenceRow has an
# `icon:` initializer too, which one bare trailing closure could also mean.
[component.SettingsRow]
positional = ["title"]
props.title = { type = "string", required = true }
props.subtitle = { type = "string" }
slots.trailing = {}

[component.SettingsRow.swiftui]
call = "DazzUI.PreferenceRow"
args = [
  { arg = "title", prop = "title" },
  { arg = "subtitle", prop = "subtitle" },
  { arg = "trailing", slot = "trailing" },
]

[component.SettingsRow.winui]
element = "dazz:PreferenceRow"
attrs = [
  { attr = "Label", prop = "title" },
  { attr = "Description", prop = "subtitle" },
]
slots.trailing = { property = "Control" }
