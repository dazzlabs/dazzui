[package]
name = "settings-example"
description = "The demo app core: state, actions, update, and the ui! page."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `staticlib` is what the macOS host links; `cdylib` is what the WinUI host
# loads, and what UniFFI reads the bridge's metadata from.
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
dazzui-compiler-macro.workspace = true
uniffi.workspace = true
