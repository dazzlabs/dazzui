# dazzui-compiler: Rust as the UI source language, SwiftUI and WinUI 3 as
# compilation targets. A Cargo workspace of its own, invisible to pnpm. See
# DESIGN.md.
#
# One crate holds the compiler and the CLI. The `ui!` macro is a second
# only because a proc-macro crate can export nothing else; `runtime` is what
# an app links, the page-model seam and the macros re-exported.
[package]
name = "dazzui-compiler"
description = "Compiles Rust ui! pages to SwiftUI and WinUI source."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dazzui-compiler"
path = "src/main.rs"

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
strsim.workspace = true
toml.workspace = true
uniffi_bindgen = { workspace = true, optional = true }
camino = { workspace = true, optional = true }

[features]
default = ["bindgen"]
# Generates the UniFFI bindings `generate` writes beside the pages: Swift in
# process, C# through uniffi-bindgen-cs. The ui! macro builds without it.
bindgen = ["dep:uniffi_bindgen", "dep:camino"]

[workspace]
resolver = "3"
members = [".", "macro", "runtime", "examples/settings_example", "examples/counter_example"]
# So that `cargo test` and `cargo build` at the root cover all of them,
# not only the root package.
default-members = [".", "macro", "runtime", "examples/settings_example", "examples/counter_example"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
dazzui-compiler = { path = ".", default-features = false }
dazzui-compiler-macro = { path = "macro" }
dazzui-runtime = { path = "runtime" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
strsim = "0.11"
toml = { version = "0.8", default-features = false, features = ["parse"] }
trybuild = "1"
# The bridge is UniFFI's. Pinned, because uniffi-bindgen-cs is built against
# one UniFFI version: v0.11.0+v0.31.0 here.
uniffi = "=0.31.1"
uniffi_bindgen = "=0.31.1"
camino = "1"
